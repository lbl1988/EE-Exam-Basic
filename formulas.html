<style>
/* 页面专属样式 */
.fp-hero{background:linear-gradient(180deg,#101a33 0%,#0e1729 100%);padding:36px 0 24px}
.fp-hero h1{font-size:26px;line-height:1.3;margin-bottom:8px}
.fp-hero .lead{color:var(--muted);max-width:680px;margin-bottom:16px;font-size:14px}
.fp-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fp-stats span{background:var(--bg-card);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.fp-stats b{color:var(--primary)}

/* 过滤栏 */
.filter-bar{position:sticky;top:56px;z-index:40;background:rgba(14,23,41,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
.filter-inner{display:flex;align-items:center;gap:8px;max-width:1160px;margin:0 auto;padding:0 20px;flex-wrap:wrap}
.filter-btn{background:var(--bg-card);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.filter-btn.active{background:linear-gradient(135deg,var(--primary),#a78bfa);color:#fff;border-color:transparent}
.filter-btn .cnt{font-size:11px;opacity:.7;margin-left:4px}
.search-box{flex:1;min-width:140px;background:var(--bg-card);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:14px}
.search-box::placeholder{color:var(--muted)}

/* 学科区块 */
.subject-section{margin-bottom:28px}
.subject-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none}
.subject-header h2{font-size:18px;font-weight:700}
.subject-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.subject-meta{font-size:12px;color:var(--muted);margin-left:auto}
.chapters{overflow:hidden;transition:max-height .3s ease}
.chapters.collapsed{max-height:0 !important}

/* 章节卡 */
.chapter-card{background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.chapter-title{padding:10px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.chapter-title .ch-num{background:var(--bg-tag);color:var(--primary);padding:2px 8px;border-radius:4px;font-size:12px}

/* 公式条目 */
.f-item{padding:10px 16px;border-bottom:1px solid rgba(42,60,102,.4)}
.f-item:last-child{border-bottom:none}
.f-row{display:flex;align-items:flex-start;gap:8px}
.f-num{color:var(--muted);font-size:12px;flex-shrink:0;margin-top:2px}
.f-name{font-weight:600;font-size:14px}
.f-formula{font-family:"Cascadia Code",Consolas,"Courier New",monospace;color:#f0a868;font-size:14px;margin:4px 0;line-height:1.5;word-break:break-all}
.f-note{font-size:12px;color:var(--muted)}
.f-tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-left:6px}
.f-tag.high{background:rgba(239,68,68,.15);color:#f87171}
.f-tag.mid{background:rgba(250,204,21,.15);color:#facc15}

/* 记忆点 */
.m-item{padding:8px 16px;border-bottom:1px solid rgba(42,60,102,.4);display:flex;gap:8px;align-items:flex-start}
.m-item:last-child{border-bottom:none}
.m-bullet{color:var(--primary);flex-shrink:0;margin-top:2px}
.m-text{font-size:13px;color:var(--text);line-height:1.6}
.m-section{background:rgba(79,140,255,.06);border-left:3px solid var(--primary)}
.m-section-title{padding:8px 16px;font-weight:600;font-size:14px;color:var(--primary)}

@media(max-width:640px){
  .fp-hero h1{font-size:22px}
  .filter-btn{padding:5px 10px;font-size:12px}
  .f-formula{font-size:13px}
  .chapter-title{font-size:14px}
  .subject-header h2{font-size:16px}
}

/* ====== 渲染 ====== */
var container=document.getElementById('content');
var noResult=document.getElementById('noResult');
var currentFilter='all';
var searchTerm='';

function render(){
  var filtered=DATA.filter(function(d){
    if(currentFilter!=='all' && d.sub!==currentFilter) return false;
    if(searchTerm){
      var s=searchTerm.toLowerCase();
      if(d.formula && d.formula.toLowerCase().indexOf(s)<0 && d.name && d.name.toLowerCase().indexOf(s)<0 && d.text && d.text.toLowerCase().indexOf(s)<0) return false;
    }
    return true;
  });
  
  if(filtered.length===0){container.innerHTML='';noResult.style.display='block';return;}
  noResult.style.display='none';
  
  // 按学科分组
  var subjects={};
  filtered.forEach(function(d){
    if(!subjects[d.sub]) subjects[d.sub]={name:d.subName,color:d.color,chapters:{}};
    if(!subjects[d.sub].chapters[d.ch]) subjects[d.sub].chapters[d.ch]={name:d.chName,items:[]};
    subjects[d.sub].chapters[d.ch].items.push(d);
  });
  
  var html='';
  Object.keys(subjects).forEach(function(sk){
    var s=subjects[sk];
    html+='<div class="subject-section">';
    html+='<div class="subject-header" onclick="this.nextElementSibling.classList.toggle(\'collapsed\')">';
    html+='<div class="subject-dot" style="background:'+s.color+'"></div>';
    html+='<h2>'+s.name+'</h2>';
    html+='<span class="subject-meta">'+Object.keys(s.chapters).length+'章</span>';
    html+='</div>';
    html+='<div class="chapters">';
    
    Object.keys(s.chapters).forEach(function(ck){
      var c=s.chapters[ck];
      var hasFormula=c.items.some(function(i){return i.type==='formula'});
      var hasMemory=c.items.some(function(i){return i.type==='memory'});
      
      html+='<div class="chapter-card">';
      html+='<div class="chapter-title"><span class="ch-num">'+ck+'</span>'+c.name+'</div>';
      
      c.items.forEach(function(item){
        if(item.type==='formula'){
          html+='<div class="f-item"><div class="f-row">';
          html+='<span class="f-num">'+item.num+'</span>';
          html+='<div><div class="f-name">'+item.name;
          if(item.freq==='high') html+='<span class="f-tag high">高频</span>';
          else if(item.freq==='mid') html+='<span class="f-tag mid">中频</span>';
          html+='</div>';
          html+='<div class="f-formula">'+item.formula+'</div>';
          if(item.note) html+='<div class="f-note">📌 '+item.note+'</div>';
          html+='</div></div>';
        } else {
          html+='<div class="m-item"><span class="m-bullet">●</span><span class="m-text">'+item.text+'</span></div>';
        }
      });
      
      html+='</div>';
    });
    
    html+='</div></div>';
  });
  
  container.innerHTML=html;
}

/* 过滤按钮 */
document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
    this.classList.add('active');
    currentFilter=this.dataset.filter;
    render();
  });
});

/* 搜索 */
document.getElementById('searchBox').addEventListener('input',function(){
  searchTerm=this.value.trim();
  render();
});

/* 初始渲染 */
render();
